name: Go CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      TEST_DB_URI: mongodb://localhost:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build
        run: go build -C api -v cmd/main.go

      - name: Unit tests
        run: make -C api coverage

      - name: End-to-end tests
        run: make -C api coverage-e2e
