        schema:
          $ref: '#/definitions/ormi.TodoOrderBody'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Reorder todos
      tags:
      - ormi
  /ormi/stats:
    get:
      description: Todos completed per day over the last year (days without completion
        are omitted), completion streaks and counts of open todos
      parameters:
      - default: UTC
        description: IANA timezone used to split days
        in: query
        name: tz
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ormi.TodoStats'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get todo stats
      tags:
      - ormi
  /ormi/stats/{year}:
    get:
      description: Count the todos completed per day of a calendar year, days without
        completion are omitted
      parameters:
      - description: Calendar year
        in: path
        name: year
        required: true
        type: integer
      - default: UTC
        description: IANA timezone used to split days
        in: query
        name: tz
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ormi.TodoDayCount'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get completions of a year
      tags:
      - ormi
  /users/{id}:
