      html_url:
        type: string
      id:
        type: integer
      location:
        type: string
      login:
        type: string
      name:
        type: string
      node_id:
        type: string
      organizations_url:
        type: string
      public_gists:
        type: integer
      public_repos:
        type: integer
      received_events_url:
        type: string
      repos_url:
        type: string
      site_admin:
        type: boolean
      starred_url:
        type: string
      subscriptions_url:
        type: string
      twitter_username:
        type: string
      type:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.HipparcosHR:
    properties:
      Amag:
        type: number
      BV:
        type: number
      hip:
        type: integer
    type: object
  models.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      flavour:
        type: string
      github:
