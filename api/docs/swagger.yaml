basePath: /api
definitions:
  controllers.ContactBody:
    properties:
      email:
        type: string
      message:
        maxLength: 1000
        minLength: 10
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      userId:
        type: string
    required:
    - email
    - message
    - name
    type: object
  controllers.GithubLoginBody:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  controllers.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  controllers.LoginBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  controllers.PatchCodeCarbonProjectBody:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 100
        type: string
    type: object
  controllers.PatchUserBody:
    properties:
      flavour:
        enum:
        - latte
        - frappe
        - macchiato
        - mocha
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
    type: object
  controllers.PostCodeCarbonProjectBody:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  controllers.VerifyBody:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  models.CodeCarbonEmissions:
    properties:
      cpu_energy:
        type: number
      cpu_power:
        type: number
      created_at:
        type: string
      duration:
        type: integer
      emissions_rate:
        type: number
      emissions_sum:
        type: number
      energy_consumption:
        type: number
      gpu_energy:
        type: number
      gpu_power:
        type: number
      id:
        type: string
      ram_energy:
        type: number
      ram_power:
        type: number
      timestamp:
        type: string
    type: object
  models.CodeCarbonExperiment:
    properties:
      cloud_provider:
        type: string
      cloud_region:
        type: string
      country_iso_code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      on_cloud:
        type: boolean
      region:
        type: string
      runs:
        items:
          $ref: '#/definitions/models.CodeCarbonRun'
        type: array
    type: object
  models.CodeCarbonProject:
    properties:
      closed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      experiments:
        items:
          $ref: '#/definitions/models.CodeCarbonExperiment'
        type: array
      id:
        type: string
      name:
        type: string
      tokens:
        items:
          $ref: '#/definitions/models.CodeCarbonToken'
        type: array
      updated_at:
        type: string
    type: object
  models.CodeCarbonRun:
    properties:
      codecarbon_version:
        type: string
      cpu_count:
        type: integer
      cpu_model:
        type: string
      created_at:
        type: string
      emissions:
        items:
          $ref: '#/definitions/models.CodeCarbonEmissions'
        type: array
      gpu_model:
        type: string
      id:
        type: string
      location:
        items:
          type: number
        type: array
      os:
        type: string
      provider:
        type: string
      python_version:
        type: string
      ram_total_size:
        type: number
      region:
        type: string
      tracking_mode:
        type: string
    type: object
  models.CodeCarbonToken:
    properties:
      created_at:
        type: string
      id:
        type: string
      lastUsed_at:
        type: string
      name:
        type: string
      revoked_at:
        type: string
      token:
        type: string
    type: object
  models.GitHubUser:
