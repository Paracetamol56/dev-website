        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CodeCarbonProject'
            type: array
        "403":
          description: Forbidden
      security:
      - Bearer: []
      summary: Get codecarbon projects
      tags:
      - codecarbon
