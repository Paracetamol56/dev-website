paths:
  /auth/github/login:
    post:
      consumes:
      - application/json
      description: Login or register a user with GitHub by code
      parameters:
      - description: Code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.GithubLoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
      summary: Login or register a user with GitHub
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login or register a user by email
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Login or register a user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh a user's access token by refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.VerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
      summary: Refresh a user's access token
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verify a user's email by token
      parameters:
      - description: Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.VerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
      summary: Verify a user's email
      tags:
      - auth
