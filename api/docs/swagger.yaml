basePath: /api
definitions:
  controllers.ContactBody:
    properties:
      email:
        type: string
      message:
        maxLength: 1000
        minLength: 10
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      userId:
        type: string
    required:
    - email
    - message
    - name
    type: object
  controllers.GithubLoginBody:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  controllers.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  controllers.LoginBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  controllers.PatchTodoBody:
    properties:
      description:
        maxLength: 1000
        type: string
      dueDate:
        format: date-time
        type: string
      gitIssue:
        minimum: 1
        type: integer
      gitURL:
        type: string
      labels:
        items:
          type: string
        type: array
      state:
        enum:
        - TODO
        - IN_PROGRESS
        - DONE
        - CANCELLED
        type: string
      title:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  controllers.PatchUserBody:
    properties:
      flavour:
        enum:
        - latte
        - frappe
        - macchiato
        - mocha
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
    type: object
  controllers.TodoBody:
    properties:
      description:
        maxLength: 1000
        type: string
      dueDate:
        format: date-time
        type: string
      gitIssue:
        minimum: 1
        type: integer
      gitURL:
        type: string
      labels:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - title
    type: object
  controllers.TodoOrderBody:
    properties:
      ids:
        items:
          type: string
        maxItems: 1000
        minItems: 1
        type: array
    required:
    - ids
    type: object
  controllers.VerifyBody:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  models.GitHubUser:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      blog:
        type: string
      company:
        type: string
      created_at:
        type: string
      email:
        type: string
      events_url:
        type: string
      followers:
        type: integer
      followers_url:
        type: string
      following:
        type: integer
      following_url:
        type: string
      gists_url:
        type: string
      gravatar_id:
        type: string
      hireable:
        type: boolean
      html_url:
        type: string
      id:
        type: integer
      location:
        type: string
      login:
        type: string
      name:
        type: string
      node_id:
        type: string
      organizations_url:
        type: string
      public_gists:
        type: integer
      public_repos:
        type: integer
      received_events_url:
        type: string
      repos_url:
        type: string
      site_admin:
        type: boolean
      starred_url:
        type: string
      subscriptions_url:
        type: string
      twitter_username:
        type: string
      type:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.HipparcosHR:
    properties:
      Amag:
        type: number
      BV:
        type: number
      hip:
        type: integer
    type: object
  models.Icon:
    properties:
      hex:
        example: ECD53F
        type: string
      id:
        example: lucide:a-arrow-down
        type: string
      name:
        example: a-arrow-down
        type: string
      source:
        example: lucide
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        example: A Arrow Down
        type: string
    type: object
  models.IconSearchResult:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Icon'
        type: array
      total:
        example: 42
        type: integer
    type: object
  models.OrmiEvent:
    properties:
      newState:
        example: DONE
        type: string
      previousState:
        example: TODO
        type: string
      updatedAt:
        format: date-time
        type: string
    type: object
  models.Todo:
    properties:
      createdAt:
        format: date-time
        type: string
      description:
        type: string
      dueDate:
        format: date-time
        type: string
      gitIssue:
        type: integer
      gitURL:
        type: string
      history:
        items:
          $ref: '#/definitions/models.OrmiEvent'
        type: array
      id:
        type: string
      labels:
        items:
          type: string
        type: array
      position:
        type: integer
      state:
        enum:
        - TODO
        - IN_PROGRESS
        - DONE
        - CANCELLED
        type: string
      title:
        type: string
      user:
        type: string
    type: object
  models.TodoDayCount:
    properties:
      count:
        type: integer
      date:
        example: "2026-10-09"
        type: string
    type: object
  models.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      flavour:
        type: string
      github:
        $ref: '#/definitions/models.GitHubUser'
      githubAccessToken:
        type: string
      id:
        type: string
      lastLogin:
        type: string
      lastRefresh:
        type: string
      name:
        type: string
      profilePicture:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: matheo.galu56@gmail.com
    name: Matheo Galuba
    url: https://dev.matheo-galuba.com/contact
  description: This is the API for my personal dev website
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Dev Website API
  version: "1.0"
paths:
  /auth/github/login:
    post:
      consumes:
      - application/json
      description: Login or register a user with GitHub by code
      parameters:
      - description: Code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.GithubLoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
      summary: Login or register a user with GitHub
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login or register a user by email
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Login or register a user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh a user's access token by refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.VerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
      summary: Refresh a user's access token
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verify a user's email by token
      parameters:
      - description: Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.VerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
      summary: Verify a user's email
      tags:
      - auth
  /contact:
    post:
      consumes:
      - application/json
      description: Send a contact message
      parameters:
      - description: Contact message
        in: body
        name: contact
        required: true
        schema:
          $ref: '#/definitions/controllers.ContactBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
      summary: Send a contact message
      tags:
      - contact
  /health:
    get:
      description: Get health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.HealthResponse'
      summary: Get health status
      tags:
      - health
  /hipparcos/hr:
    get:
      description: Get all Hipparcos HR stars
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.HipparcosHR'
            type: array
      summary: Get all Hipparcos HR stars
      tags:
      - hipparcos
  /hipparcos/hr/{hip}:
    get:
      description: Get one Hipparcos HR star by HIP number
      parameters:
      - description: HIP number
        in: path
        name: hip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HipparcosHR'
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Get one Hipparcos HR star
      tags:
      - hipparcos
  /icons:
    get:
      description: List every available lucide.dev and simpleicons.org icon, refreshed
        weekly
      parameters:
      - description: Only return icons from this source
        enum:
        - lucide
        - simpleicons
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Icon'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List icons
      tags:
      - icons
  /icons/search:
    get:
      description: Search lucide.dev and simpleicons.org icons by text (every word
        must match the name, title or a tag), source and tag. Results are ranked by
        relevance.
      parameters:
      - description: Text to search for
        in: query
        name: q
        type: string
      - collectionFormat: multi
        description: Only return icons from these sources (repeat the parameter for
          several)
        in: query
        items:
          enum:
          - lucide
          - simpleicons
          type: string
        name: source
        type: array
      - description: Only return icons having this tag (case-insensitive)
        in: query
        name: tag
        type: string
      - default: 50
        description: Maximum number of results
        in: query
        maximum: 500
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of results to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.IconSearchResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search icons
      tags:
      - icons
  /ormi:
    get:
      description: List the todos of the authenticated user, in their custom order
      parameters:
      - description: Only return todos in this state
        enum:
        - TODO
        - IN_PROGRESS
        - DONE
        - CANCELLED
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Todo'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List todos
      tags:
      - ormi
    post:
      consumes:
      - application/json
      description: Create a todo in the TODO state, placed at the end of the list
      parameters:
      - description: Todo data
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/controllers.TodoBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Todo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a todo
      tags:
      - ormi
  /ormi/{id}:
    delete:
      description: Delete a todo of the authenticated user by id
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Delete a todo
      tags:
      - ormi
    get:
      description: Get a todo of the authenticated user by id
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Todo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get one todo
      tags:
      - ormi
    patch:
      consumes:
      - application/json
      description: Update the given fields of a todo. A null dueDate removes the due
        date, a new state is appended to the history.
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchTodoBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Todo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update a todo
      tags:
      - ormi
  /ormi/order:
    put:
      consumes:
      - application/json
      description: Set the position of the given todos to their index in the list
      parameters:
      - description: Todo IDs in their new order
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/controllers.TodoOrderBody'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Reorder todos
      tags:
      - ormi
  /ormi/stats:
    get:
      description: Count the todos completed per day over the last year, days without
        completion are omitted
      parameters:
      - default: UTC
        description: IANA timezone used to split days
        in: query
        name: tz
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TodoDayCount'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get completion stats
      tags:
      - ormi
  /users/{id}:
    delete:
      description: Delete a user by id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - Bearer: []
      summary: Delete a user
      tags:
      - user
    get:
      description: Get one user by id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
        "404":
          description: Not Found
      security:
      - Bearer: []
      summary: Get one user
      tags:
      - user
    patch:
      consumes:
      - application/json
      description: Update a user by id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User data
        in: body
        name: patchUser
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchUserBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - Bearer: []
      summary: Update a user
      tags:
      - user
  /users/{id}/export:
    get:
      description: Get user export by id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - Bearer: []
      summary: Get user export
      tags:
      - user
securityDefinitions:
  Bearer:
    description: Bearer token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
