basePath: /api
definitions:
  admin.AuditPage:
    properties:
      entries:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      users:
        additionalProperties:
          $ref: '#/definitions/admin.UserSummary'
        type: object
    type: object
  admin.RoleBody:
    properties:
      role:
        enum:
        - admin
        type: string
    type: object
  admin.UserSummary:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  admin.UsersPage:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/user.User'
        type: array
    type: object
  audit.Action:
    enum:
    - auth.link_requested
    - auth.login
    - auth.login_failed
    - user.created
    - user.identity_linked
    - user.identity_unlinked
    - user.passkey_added
    - user.passkey_removed
    - user.profile_updated
    - user.data_exported
    - user.deleted
    - wordcloud.created
    - wordcloud.duplicated
    - wordcloud.updated
    - wordcloud.deleted
    - wordcloud.word_hidden
    - wordcloud.words_merged
    - contact.sent
    - admin.role_changed
    - access.denied
    - access.rate_limited
    type: string
    x-enum-varnames:
    - AuthLinkRequested
    - AuthLogin
    - AuthLoginFailed
    - UserCreated
    - UserIdentityLinked
    - UserIdentityUnlinked
    - UserPasskeyAdded
    - UserPasskeyRemoved
    - UserProfileUpdated
    - UserDataExported
    - UserDeleted
    - WordCloudCreated
    - WordCloudDuplicated
    - WordCloudUpdated
    - WordCloudDeleted
    - WordCloudWordHidden
    - WordCloudWordsMerged
    - ContactSent
    - AdminRoleChanged
    - AccessDenied
    - AccessRateLimited
  audit.Entry:
    properties:
      action:
        $ref: '#/definitions/audit.Action'
      createdAt:
        type: string
      id:
        type: string
      ip:
        type: string
      meta:
        $ref: '#/definitions/audit.Meta'
      requestId:
        type: string
      target:
        $ref: '#/definitions/audit.Target'
      userAgent:
        type: string
      userId:
        type: string
    type: object
  audit.Meta:
    additionalProperties: {}
    type: object
  audit.Target:
    properties:
      id:
        type: string
      type:
        type: string
    type: object
  auth.LoginBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.OAuthLoginBody:
    properties:
      code:
        type: string
      redirectUri:
        type: string
    required:
    - code
    type: object
  auth.OAuthProviderResponse:
    properties:
      authorizeUrl:
        example: https://github.com/login/oauth/authorize
        type: string
      clientId:
        type: string
      name:
        example: github
        type: string
      scope:
        example: read:user user:email
        type: string
    type: object
  auth.PasskeyBeginResponse:
    properties:
      options: {}
      sessionId:
        type: string
    type: object
  auth.PasskeyFinishBody:
    properties:
      credential:
        type: object
      name:
        maxLength: 50
        type: string
      sessionId:
        type: string
    required:
    - credential
    - sessionId
    type: object
  auth.Session:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/user.User'
    type: object
  auth.VerifyBody:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  chip.Microprocessor:
    properties:
      density:
        type: number
      dieSize:
        type: number
      frequency:
        type: number
      gateSize:
        type: number
      id:
        type: string
      manufacturer:
        type: string
      name:
        type: string
      release:
        format: date-time
        type: string
      source:
        type: string
      sourceUrl:
        type: string
      tdp:
        type: number
      transistors:
        type: number
      type:
        example: CPU
        type: string
      vendor:
        type: string
    type: object
  contact.ContactBody:
    properties:
      email:
        type: string
      message:
        maxLength: 1000
        minLength: 10
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      userId:
        type: string
    required:
    - email
    - message
    - name
    type: object
  health.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  hipparcos.HipparcosHR:
    properties:
      Amag:
        type: number
      BV:
        type: number
      hip:
        type: integer
    type: object
  icon.Icon:
    properties:
      hex:
        example: ECD53F
        type: string
      id:
        example: lucide:a-arrow-down
        type: string
      name:
        example: a-arrow-down
        type: string
      source:
        example: lucide
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        example: A Arrow Down
        type: string
    type: object
  icon.IconSearchResult:
    properties:
      items:
        items:
          $ref: '#/definitions/icon.Icon'
        type: array
      total:
        example: 42
        type: integer
    type: object
  ormi.OrmiEvent:
    properties:
      newState:
        example: DONE
        type: string
      previousState:
        example: TODO
        type: string
      updatedAt:
        format: date-time
        type: string
    type: object
  ormi.PatchTodoBody:
    properties:
      description:
        maxLength: 1000
        type: string
      dueDate:
        format: date-time
        type: string
      gitIssue:
        minimum: 1
        type: integer
      gitURL:
        type: string
      labels:
        items:
          type: string
        type: array
      state:
        enum:
        - TODO
        - IN_PROGRESS
        - STANDBY
        - DONE
        - CANCELLED
        type: string
      title:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  ormi.Todo:
    properties:
      createdAt:
        format: date-time
        type: string
      description:
        type: string
      dueDate:
        format: date-time
        type: string
      gitIssue:
        type: integer
      gitURL:
        type: string
      history:
        items:
          $ref: '#/definitions/ormi.OrmiEvent'
        type: array
      id:
        type: string
      labels:
        items:
          type: string
        type: array
      position:
        type: integer
      state:
        enum:
        - TODO
        - IN_PROGRESS
        - STANDBY
        - DONE
        - CANCELLED
        type: string
      title:
        type: string
      user:
        type: string
    type: object
  ormi.TodoBody:
    properties:
      description:
        maxLength: 1000
        type: string
      dueDate:
        format: date-time
        type: string
      gitIssue:
        minimum: 1
        type: integer
      gitURL:
        type: string
      labels:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - title
    type: object
  ormi.TodoDayCount:
    properties:
      count:
        type: integer
      date:
        example: "2026-10-09"
        type: string
    type: object
  ormi.TodoOrderBody:
    properties:
      ids:
        items:
          type: string
        maxItems: 1000
        minItems: 1
        type: array
    required:
    - ids
    type: object
  ormi.TodoPage:
    properties:
      items:
        items:
          $ref: '#/definitions/ormi.Todo'
        type: array
      total:
        example: 42
        type: integer
    type: object
  ormi.TodoStats:
    properties:
      currentStreak:
        type: integer
      days:
        items:
          $ref: '#/definitions/ormi.TodoDayCount'
        type: array
      firstYear:
        example: 2024
        type: integer
      inProgress:
        type: integer
      longestStreak:
        type: integer
      overdue:
        type: integer
      standby:
        type: integer
      todo:
        type: integer
    type: object
  user.Identity:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      lastLogin:
        type: string
      linkedAt:
        type: string
      name:
        type: string
      profileUrl:
        type: string
      provider:
        enum:
        - email
        - github
        - google
        type: string
      providerId:
        type: string
      username:
        type: string
    type: object
  user.Passkey:
    properties:
      createdAt:
        type: string
      id:
        type: string
      lastUsed:
        type: string
      name:
        type: string
    type: object
  user.PatchUserBody:
    properties:
      flavour:
        enum:
        - latte
        - frappe
        - macchiato
        - mocha
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
    type: object
  user.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      flavour:
        type: string
      id:
        type: string
      identities:
        items:
          $ref: '#/definitions/user.Identity'
        type: array
      lastLogin:
        type: string
      lastRefresh:
        type: string
      name:
        type: string
      passkeys:
        items:
          $ref: '#/definitions/user.Passkey'
        type: array
      profilePicture:
        type: string
      role:
        enum:
        - admin
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: matheo.galu56@gmail.com
    name: Matheo Galuba
    url: https://dev.matheo-galuba.com/contact
  description: This is the API for my personal dev website
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Dev Website API
  version: "1.0"
paths:
  /admin/audit:
    get:
      description: List what users did, newest first. With a user, the entries are
        the ones of that user and the ones about them.
      parameters:
      - description: User ID
        in: query
        name: userId
        type: string
      - description: Action, such as auth.login
        in: query
        name: action
        type: string
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Entries per page, 25 by default, 100 at most
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AuditPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List audit entries
      tags:
      - admin
  /admin/users:
    get:
      description: List the users whose email or name contains the search, newest
        first
      parameters:
      - description: Part of an email or a name
        in: query
        name: search
        type: string
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Users per page, 25 by default, 100 at most
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UsersPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List users
      tags:
      - admin
  /admin/users/{id}:
    delete:
      description: Delete the account of a user, who is told by email. Admins cannot
        delete their own account here nor the one of the site owner.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Delete a user
      tags:
      - admin
    get:
      description: Get the whole account of any user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get a user
      tags:
      - admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Make a user an admin, or a regular user with an empty role. Admins
        cannot change their own role nor the one of the site owner.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.RoleBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Change the role of a user
      tags:
      - admin
  /auth/{provider}:
    post:
      consumes:
      - application/json
      description: Exchange an authorization code for the identity of its owner and
        attach it to the user having the same email, creating the user if needed.
        When called with a bearer token, the identity must have the email of the authenticated
        user.
      parameters:
      - description: Identity provider
        enum:
        - github
        - google
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code and the redirect URI it was issued for
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.OAuthLoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login, register or link an identity with an OAuth provider
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login or register a user by email
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Login or register a user
      tags:
      - auth
  /auth/passkey/begin:
    post:
      description: Get the options to pass to navigator.credentials.get(). No email
        is needed, the passkey identifies the user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PasskeyBeginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a passkey login
      tags:
      - auth
  /auth/passkey/finish:
    post:
      consumes:
      - application/json
      description: Verify the assertion returned by navigator.credentials.get() and
        log the owner of the passkey in
      parameters:
      - description: Session and assertion
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.PasskeyFinishBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish a passkey login
      tags:
      - auth
  /auth/providers:
    get:
      description: List the identity providers configured on this server, with what
        a client needs to start their authorization flow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.OAuthProviderResponse'
            type: array
      summary: List OAuth providers
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh a user's access token by refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
      summary: Refresh a user's access token
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verify a user's email by token
      parameters:
      - description: Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
      summary: Verify a user's email
      tags:
      - auth
  /chips:
    get:
      description: 'List CPUs and GPUs with their transistor count (in millions),
        process node (nm), die area (mm²) and density (transistors per mm²). Documents
        are flat and do not all have the same keys: besides the fields documented
        here, each one carries every column of its source table (for example processor,
        designer, fab, year), and fields without a value are omitted. A column holding
        a quantity is an object with its value and unit, such as {"value": 8000, "unit":
        "nm"}, plus the original text when it says more; other columns are text. Chips
        imported from Wikipedia are refreshed weekly and licensed under CC BY-SA 4.0,
        see their sourceUrl.'
      parameters:
      - description: Only return chips of this type
        enum:
        - CPU
        - GPU
        in: query
        name: type
        type: string
      - description: Only return chips of this vendor
        in: query
        name: vendor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chip.Microprocessor'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List chips
      tags:
      - chips
  /chips/{id}:
    get:
      description: Get a chip by id
      parameters:
      - description: Chip ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chip.Microprocessor'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get one chip
      tags:
      - chips
  /contact:
    post:
      consumes:
      - application/json
      description: Send a contact message
      parameters:
      - description: Contact message
        in: body
        name: contact
        required: true
        schema:
          $ref: '#/definitions/contact.ContactBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
      summary: Send a contact message
      tags:
      - contact
  /health:
    get:
      description: Get health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthResponse'
      summary: Get health status
      tags:
      - health
  /hipparcos/hr:
    get:
      description: Get all Hipparcos HR stars
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hipparcos.HipparcosHR'
            type: array
      summary: Get all Hipparcos HR stars
      tags:
      - hipparcos
  /hipparcos/hr/{hip}:
    get:
      description: Get one Hipparcos HR star by HIP number
      parameters:
      - description: HIP number
        in: path
        name: hip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hipparcos.HipparcosHR'
        "400":
          description: Bad Request
        "404":
          description: Not Found
      summary: Get one Hipparcos HR star
      tags:
      - hipparcos
  /icons:
    get:
      description: List every available lucide.dev and simpleicons.org icon, refreshed
        weekly
      parameters:
      - description: Only return icons from this source
        enum:
        - lucide
        - simpleicons
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/icon.Icon'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List icons
      tags:
      - icons
  /icons/search:
    get:
      description: Search lucide.dev and simpleicons.org icons by text (every word
        must match the name, title or a tag), source and tag. Results are ranked by
        relevance.
      parameters:
      - description: Text to search for
        in: query
        name: q
        type: string
      - collectionFormat: multi
        description: Only return icons from these sources (repeat the parameter for
          several)
        in: query
        items:
          enum:
          - lucide
          - simpleicons
          type: string
        name: source
        type: array
      - description: Only return icons having this tag (case-insensitive)
        in: query
        name: tag
        type: string
      - default: 50
        description: Maximum number of results
        in: query
        maximum: 500
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of results to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icon.IconSearchResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search icons
      tags:
      - icons
  /ormi:
    get:
      description: List a page of the todos of the authenticated user, filtered by
        state, labels and date of last state change, along with the total number of
        matches
      parameters:
      - collectionFormat: multi
        description: Only return todos in these states (repeat the parameter for several)
        in: query
        items:
          enum:
          - TODO
          - IN_PROGRESS
          - STANDBY
          - DONE
          - CANCELLED
          type: string
        name: state
        type: array
      - collectionFormat: multi
        description: Only return todos having all these labels (repeat the parameter
          for several)
        in: query
        items:
          type: string
        name: label
        type: array
      - description: Only return todos whose last state change is at or after this
          date
        format: date-time
        in: query
        name: from
        type: string
      - description: Only return todos whose last state change is before this date
        format: date-time
        in: query
        name: to
        type: string
      - default: position
        description: Custom order, due date (todos without one last), creation date
          or last state change
        enum:
        - position
        - due
        - created
        - updated
        in: query
        name: sort
        type: string
      - description: Sort direction, defaults to desc for created and updated, asc
          otherwise
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 50
        description: Maximum number of results
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of results to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ormi.TodoPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List todos
      tags:
      - ormi
    post:
      consumes:
      - application/json
      description: Create a todo in the TODO state, placed at the end of the list
      parameters:
      - description: Todo data
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/ormi.TodoBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ormi.Todo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a todo
      tags:
      - ormi
  /ormi/{id}:
    delete:
      description: Delete a todo of the authenticated user by id
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Delete a todo
      tags:
      - ormi
    get:
      description: Get a todo of the authenticated user by id
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ormi.Todo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get one todo
      tags:
      - ormi
    patch:
      consumes:
      - application/json
      description: Update the given fields of a todo. A null dueDate removes the due
        date, a new state is appended to the history.
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/ormi.PatchTodoBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ormi.Todo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update a todo
      tags:
      - ormi
  /ormi/labels:
    get:
      description: List the labels already used by the authenticated user, most used
        first, optionally restricted to those containing a text (case-insensitive)
      parameters:
      - description: Text the labels must contain
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
